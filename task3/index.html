<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="My Day — личный список задач">
    <title>My Day — список задач</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app">
        <header class="app-header">
            <p class="eyebrow">YOUR PERSONAL SPACE</p>
            <h1>My <span>Day.</span></h1>
            <p class="subtitle">Небольшие шаги тоже имеют значение.</p>
        </header>

        <section class="todo-section" aria-label="Список задач">
            <form class="todo-form" id="todo-form">
                <label class="visually-hidden" for="task-input">
                    Новая задача
                </label>
                <input
                    type="text"
                    id="task-input"
                    placeholder="Что нужно сделать?"
                    autocomplete="off"
                >
                <button class="add-button" type="submit">
                    <span aria-hidden="true">+</span> Добавить
                </button>
            </form>

            <p class="input-message" id="input-message" aria-live="polite"></p>

            <div class="task-summary" aria-live="polite">
                <p id="task-count">Осталось: 0, Выполнено: 0</p>
            </div>

            <nav class="filters" aria-label="Фильтр задач">
                <button class="filter-button active" type="button"
                    data-filter="all" aria-pressed="true">
                    Все
                </button>
                <button class="filter-button" type="button"
                    data-filter="active" aria-pressed="false">
                    Активные
                </button>
                <button class="filter-button" type="button"
                    data-filter="completed" aria-pressed="false">
                    Завершённые
                </button>
            </nav>

            <ul class="task-list" id="task-list"></ul>

            <p class="empty-state" id="empty-state">
                Здесь пока тихо. Добавь свою первую задачу ✦
            </p>
        </section>

        <footer class="app-footer">
            <span>MY DAY</span>
            <span>ONE THING AT A TIME</span>
        </footer>
    </main>
</body>
</html>
